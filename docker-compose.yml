services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
    image: synapsea-web:latest
    container_name: synapsea-web
    ports:
      - "4173:4173"
    restart: unless-stopped
    networks:
      - shared-net
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: synapsea-server:latest
    container_name: synapsea-server
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${VITE_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SYNAPSEA_ADMIN_PASSWORD: ${SYNAPSEA_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-https://synapsea.uazapi.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - shared-net

  keepalive:
    image: synapsea-server:latest
    container_name: synapsea-keepalive
    environment:
      SUPABASE_URL: ${VITE_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      KEEPALIVE_INTERVAL_SECONDS: ${KEEPALIVE_INTERVAL_SECONDS:-43200}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do node scripts/keepalive.mjs; sleep "${KEEPALIVE_INTERVAL_SECONDS:-43200}"; done'
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - shared-net

networks:
  shared-net:
    external: true
